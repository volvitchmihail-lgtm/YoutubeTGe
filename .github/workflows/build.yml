name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Go shared library (arm64-v8a)
        run: |
          export ANDROID_NDK_HOME=${{ env.NDK_HOME }}
          go mod tidy
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm64 \
          CGO_LDFLAGS="-llog" \
          CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang \
          go build -buildmode=c-shared \
            -o app/src/main/jniLibs/arm64-v8a/libtgwsproxy.so \
            .

      - name: Build Go shared library (armeabi-v7a)
        run: |
          export ANDROID_NDK_HOME=${{ env.NDK_HOME }}
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm \
          GOARM=7 \
          CGO_LDFLAGS="-llog" \
          CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang \
          go build -buildmode=c-shared \
            -o app/src/main/jniLibs/armeabi-v7a/libtgwsproxy.so \
            .

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeTGe-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
